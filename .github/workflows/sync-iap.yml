name: Sync IAP Localizations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync IAP localizations to App Store Connect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Sync
        run: bundle exec fastlane ios sync_iap
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
